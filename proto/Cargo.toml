[package]
name = "bold-proto"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.89"
bytes = "1.8.0"
fastxdr = "1.0.2"
hex-literal = "0.4.1"
num = "0.4.3"
num-derive = "0.4.2"
num-traits = "0.2.19"
onc-rpc = "0.3.2"
serde = { version = "1.0.210", features = ["derive"] }
serde-xdr = "0.6.0"
serde_bytes = "0.11.15"
serde_derive = "1.0.210"
thiserror = "2.0.3"
thiserror-context = "0.1.2"
tokio-util = { version = "^0.7.12", features = ["codec"] }
tracing = "0.1.40"

[dev-dependencies]
base64 = "0.22.1"
