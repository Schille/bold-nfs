[package]
name = "bold"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bold-proto = { path = "../proto" }
anyhow = "1.0"
tokio = {version = "^1.36.0" , features = ["full", "tracing"] }
bytes = "^1.8.0"
tracing = "0.1.40"
futures = "0.3.30"
futures-core = "0.3.30"
tokio-stream = "0.1.15"
tracing-subscriber = "0.3.18"
tokio-util = { version = "^0.7.12", features = ["codec"] }
rand = "0.8.5"
multi_index_map = "0.11.0"
vfs = { version = "0.12.2", features = ["async-vfs"] }
async-trait = "0.1.81"
tracing-test = "0.2.5"
async-lock = "3.4.2"
